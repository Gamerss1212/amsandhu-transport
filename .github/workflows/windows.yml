# Builds Trading AI natively on a real Windows machine (GitHub's Windows Server 2025 runner, which shares the Windows 11
# 24H2 code base), runs the unit tests on Windows, the end-to-end self-test of the built START_TRADING_AI.exe and the
# thermal check against Windows' own sensors. Nothing here uses credentials or trades.
name: Windows build and checks

on:
  workflow_dispatch:
    inputs:
      thermal_minutes:
        description: "Minutes of full CPU load in the thermal check"
        default: "2"
  push:
    branches: ["claude/amazing-tesla-1i8gj8"]
    paths: ["trading-ai/**", ".github/workflows/windows.yml"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep line endings exactly as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JARVIS voice assistant installs, type-checks and builds on Windows
        working-directory: trading-ai/jarvis
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc -b
          npx vite build
          node --check bridge/server.mjs
          node --check bridge/trading.mjs
          node --check bridge/self.mjs

      - name: JARVIS safety rules on Windows paths (own folder only, Trading AI files refused, undo, honest window open)
        working-directory: trading-ai/jarvis
        run: npm run test:bridge

      - name: START_JARVIS.bat finds Node.js and Claude Code on Windows
        shell: cmd
        run: |
          call npm install -g @anthropic-ai/claude-code --no-audit --no-fund
          set JARVIS_CHECK_ONLY=1
          call trading-ai\packaging\START_JARVIS.bat < nul

      - name: Which Windows and which CPU
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List

      - name: Install the pinned Python packages
        working-directory: trading-ai
        run: python -m pip install -r requirements-dev.txt pyinstaller==6.22.3

      - name: Unit tests on Windows
        working-directory: trading-ai/backend
        run: python -m pytest -q tests

      - name: Build the dashboard
        working-directory: trading-ai/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build START_TRADING_AI.exe natively
        working-directory: trading-ai
        run: python -m PyInstaller packaging\trading_ai.spec --noconfirm --clean --distpath release --workpath build

      - name: Self-test of the built exe (offline, fresh data folder)
        working-directory: trading-ai
        run: |
          .\release\TradingAI\START_TRADING_AI.exe --selftest --offline --home "$env:RUNNER_TEMP\st" | Tee-Object -FilePath selftest.log
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }

      - name: Thermal check with Windows' own sensors
        working-directory: trading-ai
        run: |
          $m = "${{ github.event.inputs.thermal_minutes || '1' }}"
          .\release\TradingAI\START_TRADING_AI.exe --thermal-check --minutes $m --home "$env:RUNNER_TEMP\th"
          $code = $LASTEXITCODE
          Get-ChildItem "$env:RUNNER_TEMP\th\thermal-reports\*.txt" | Get-Content
          if ($code -ne 0) { throw "thermal check verdict: FAIL" }

      - name: Which thermal counters this Windows provides
        run: |
          typeperf -q "Thermal Zone Information"
          typeperf -q "Processor Information" | Select-Object -First 12
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check-results
          path: |
            trading-ai/selftest.log
            ${{ runner.temp }}/th/thermal-reports/

      - uses: actions/upload-artifact@v4
        with:
          name: TradingAI-built-on-windows
          path: trading-ai/release/TradingAI/
