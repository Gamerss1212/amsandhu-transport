# Agent registry: all 50 agents (spec sections 9, 10 and 22).
# state: proposed (not built yet) | sandbox | shadow | probation | active | watchlist | retired
# core: true for the 25-agent core this kit builds in full; false = parked for later (optional).
# implementation: module:Class for built agents, null for agents not built yet.
# New signal agents start in shadow (scored by A35, no vote). Only the owner promotes them.
# Adding agent #51+: same fields, a new team slug only with a human-approved spec change (section 17).
# tests/test_registry.py checks counts, teams, tiers, phases and that every implementation imports.

