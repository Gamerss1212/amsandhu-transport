[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantagents"
version = "0.8.0"
description = "QuantAgents-50: a 50-agent quant research and paper-trading starter kit (paper only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # the quality gates' own tools are pinned, so a new release cannot fail a fresh install
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-PyYAML>=6.0",
    # the store tests need these (same pins as the [data] extra)
    "duckdb==1.5.6",
    "pyarrow==25.0.1",
]
# Phase 1 real data: the append-only store (DuckDB + Parquet) and the crypto adapter (CCXT).
# Pinned so a stored snapshot always reads back the same way.
data = [
    "duckdb==1.5.6",
    "pyarrow==25.0.1",
    "ccxt==4.5.85",
]

[project.scripts]
quantagents = "quantagents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantagents = ["py.typed", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["quantagents"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs/SPEC.md"]  # exported from the spec doc; never reformat it

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts", ".claude/hooks"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "pyarrow", "pyarrow.*", "ccxt", "ccxt.*"]
ignore_missing_imports = true
